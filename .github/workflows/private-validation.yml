name: Private development validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # inherited reviewed v4.3.1 pin
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # inherited reviewed v5.6.0 pin
        with:
          python-version: "3.11"
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Check private development selection
        run: python -B tools/verify_private_workspace.py
      - name: Run synthetic unit tests
        run: python -B -m unittest discover -s tests/unit -p "test_*.py" -v
